# Include this file once inside the HTTPS server block.
# The public login/logout routes proxy to the gateway. The internal routes are
# only callable by nginx auth_request subrequests.

location = /login {
  proxy_pass http://127.0.0.1:8790/login;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /logout {
  proxy_pass http://127.0.0.1:8790/logout;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /auth/api/session {
  proxy_pass http://127.0.0.1:8790/auth/api/session;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /auth/api/unauthorized {
  proxy_pass http://127.0.0.1:8790/auth/api/unauthorized;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
}

location = /health/auth {
  proxy_pass http://127.0.0.1:8790/healthz;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
}

location = /_admin_auth_invoice {
  internal;
  proxy_pass http://127.0.0.1:8790/internal/verify/invoice;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
  proxy_set_header X-Original-Method $request_method;
  proxy_set_header X-Original-Host $http_host;
  proxy_set_header X-Original-Proto $scheme;
  proxy_set_header X-Original-Origin $http_origin;
}

location = /_admin_auth_reimbursement {
  internal;
  proxy_pass http://127.0.0.1:8790/internal/verify/reimbursement;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
  proxy_set_header X-Original-Method $request_method;
  proxy_set_header X-Original-Host $http_host;
  proxy_set_header X-Original-Proto $scheme;
  proxy_set_header X-Original-Origin $http_origin;
}

location @admin_login_redirect {
  return 303 /login?returnTo=$uri;
}
